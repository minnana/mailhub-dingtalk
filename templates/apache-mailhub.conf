<IfModule mpm_prefork_module>
    StartServers 2
    MinSpareServers 2
    MaxSpareServers 4
    ServerLimit 6
    MaxRequestWorkers 6
    MaxConnectionsPerChild 1000
</IfModule>
<VirtualHost *:80>
    ServerName localhost
    DocumentRoot /var/www/html
    <Directory /var/www/html>
        Options FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>
    # Avoid persisting email/OAuth authorization codes in request access logs.
    CustomLog /dev/null combined
    ErrorLog /proc/self/fd/2
    LogLevel warn
</VirtualHost>
